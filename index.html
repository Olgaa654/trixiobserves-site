<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrixiObserves</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="home-page">

    <!-- =========================
         ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ
    ========================== -->

<div class="language-switcher">

    <!-- 🇷🇺 Русский -->
    <button
        class="language-button"
        data-language="ru"
        onclick="changeLanguage('ru')"
        title="Русский"
        aria-label="Русский"
    >
        <svg viewBox="0 0 30 20" class="flag-image">
            <rect width="30" height="6.67" fill="#ffffff"/>
            <rect y="6.67" width="30" height="6.67" fill="#1f4fa3"/>
            <rect y="13.34" width="30" height="6.66" fill="#d52b1e"/>
        </svg>
    </button>


    <!-- 🇩🇪 Deutsch -->
    <button
        class="language-button"
        data-language="de"
        onclick="changeLanguage('de')"
        title="Deutsch"
        aria-label="Deutsch"
    >
        <svg viewBox="0 0 30 20" class="flag-image">
            <rect width="30" height="6.67" fill="#111111"/>
            <rect y="6.67" width="30" height="6.67" fill="#d71920"/>
            <rect y="13.34" width="30" height="6.66" fill="#f4c542"/>
        </svg>
    </button>


    <!-- 🇬🇧 English -->
    <button
        class="language-button"
        data-language="en"
        onclick="changeLanguage('en')"
        title="English"
        aria-label="English"
    >
        <svg
            viewBox="0 0 60 40"
            class="flag-image"
        >

            <!-- Синий фон -->
            <rect
                width="60"
                height="40"
                fill="#173b8f"
            />

            <!-- Белые диагонали -->
            <path
                d="M0 0 L7 0 L60 33 L60 40 L53 40 L0 7 Z"
                fill="white"
            />

            <path
                d="M60 0 L53 0 L0 33 L0 40 L7 40 L60 7 Z"
                fill="white"
            />

            <!-- Красные диагонали -->
            <path
                d="M0 0 L3 0 L60 35 L60 40 L57 40 L0 5 Z"
                fill="#c8102e"
            />

            <path
                d="M60 0 L57 0 L0 35 L0 40 L3 40 L60 5 Z"
                fill="#c8102e"
            />

            <!-- Белый крест -->
            <rect
                x="25"
                width="10"
                height="40"
                fill="white"
            />

            <rect
                y="15"
                width="60"
                height="10"
                fill="white"
            />

            <!-- Красный крест -->
            <rect
                x="27"
                width="6"
                height="40"
                fill="#c8102e"
            />

            <rect
                y="17"
                width="60"
                height="6"
                fill="#c8102e"
            />

        </svg>
    </button>

</div>

    <!-- =========================
         СВЕЧЕНИЯ
    ========================== -->

    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <!-- Магические точки -->

    <div class="magic-dot dot-one"></div>

    <div class="magic-dot dot-two"></div>

    <div class="magic-dot dot-three"></div>


    <!-- =========================
         ГЛАВНЫЙ ЭКРАН
    ========================== -->

    <main class="hero">

        <h1 class="main-title">

            <span
                class="welcome-line"
                data-i18n="welcome"
            >
                Добро Пожаловать
            </span>


            <span
                class="in-world"
                data-i18n="inWorld"
            >
                в мир
            </span>


            <span class="world-name">

                TrixiObserves

                <!-- Мышка -->

                <span class="bat">

                    <span class="bat-wing bat-wing-left"></span>

                    <span class="bat-wing bat-wing-right"></span>

                    <span class="bat-body"></span>

                    <span class="bat-head">

                        <span class="bat-ear bat-ear-left"></span>

                        <span class="bat-ear bat-ear-right"></span>

                        <span class="bat-eye bat-eye-left"></span>

                        <span class="bat-eye bat-eye-right"></span>

                        <span class="bat-nose"></span>

                    </span>

                </span>

            </span>

        </h1>


        <!-- Разделительная линия -->

        <div class="gold-divider"></div>


        <!-- =========================
             ОПИСАНИЕ
        ========================== -->

        <p class="home-description">

            <span data-i18n="descriptionOne">
                Исследуй забытые мифы.
            </span>

            <br>

            <span data-i18n="descriptionTwo">
                Найди в них ответы и путь к себе.
            </span>

        </p>


        <!-- =========================
             КНОПКА
        ========================== -->

        <a
            href="explore.html"
            class="main-button"
            data-i18n="startJourney"
        >
            Начать путешествие ✦
        </a>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
