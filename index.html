<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrixiObserves — Мир забытых мифов</title>

    <!-- Рукописные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 45%,
                    rgba(35, 180, 125, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 65%,
                    rgba(145, 65, 220, 0.18),
                    transparent 35%
                ),
                #050816;

            color: #f5d477;

            overflow-x: hidden;
        }


        /* =========================
           СВЕЧЕНИЯ
        ========================= */

        .glow-green {
            position: fixed;

            width: 380px;
            height: 380px;

            background: #39ff88;
            opacity: 0.10;

            filter: blur(120px);

            border-radius: 50%;

            top: 25%;
            left: -100px;

            pointer-events: none;
        }


        .glow-purple {
            position: fixed;

            width: 450px;
            height: 450px;

            background: #a855f7;
            opacity: 0.14;

            filter: blur(130px);

            border-radius: 50%;

            bottom: -80px;
            right: -80px;

            pointer-events: none;
        }


        /* =========================
           МАГИЧЕСКИЕ ТОЧКИ
        ========================= */

        .star {
            position: fixed;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #39ff88;

            box-shadow:
                0 0 10px #39ff88,
                0 0 22px #39ff88;

            animation:
                floating 4s ease-in-out infinite;

            z-index: 2;
        }


        .star1 {
            top: 28%;
            left: 10%;
        }


        .star2 {
            top: 32%;
            right: 10%;

            background: #a855f7;

            box-shadow:
                0 0 10px #a855f7,
                0 0 22px #a855f7;

            animation-delay: 1s;
        }


        .star3 {
            bottom: 22%;
            left: 18%;

            animation-delay: 2s;
        }


        .star4 {
            bottom: 25%;
            right: 18%;

            background: #e6b84a;

            box-shadow:
                0 0 10px #e6b84a,
                0 0 22px #e6b84a;

            animation-delay: 1.5s;
        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        .hero {
            position: relative;

            z-index: 3;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            padding:
                55px
                20px
                70px;
        }


        /* =========================
           ЗАГОЛОВОК
        ========================= */

        h1 {
            max-width: 1100px;

            margin: 0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    48px,
                    8vw,
                    92px
                );

            line-height: 1.05;

            font-weight: 400;

            font-style: italic;

            color: #f3ca62;

            text-shadow:

                0 0 5px
                rgba(255, 230, 140, 0.7),

                0 0 15px
                rgba(244, 190, 65, 0.6),

                0 0 32px
                rgba(168, 85, 247, 0.3);

            transform: rotate(-1deg);
        }


        /* Первая строка */

        .welcome {
            display: block;

            margin-bottom: 8px;
        }


        /* =========================
           TRIXIOBSERVES + МЫШКА
        ========================= */

        .world-name {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            position: relative;

            padding-bottom: 14px;

            /* Зелёно-сиреневый цвет */

            background:
                linear-gradient(
                    90deg,
                    #39ff88 0%,
                    #7ee7a8 28%,
                    #c084fc 65%,
                    #a855f7 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow:
                0 0 12px rgba(57, 255, 136, 0.25),
                0 0 18px rgba(168, 85, 247, 0.25);
        }


        /* Светящаяся линия-подчёркивание */

        .world-name::after {
            content: "";

            position: absolute;

            left: 2%;
            right: 2%;

            bottom: 0;

            height: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #39ff88,
                    #b8ffca,
                    #c084fc,
                    #a855f7,
                    transparent
                );

            box-shadow:
                0 0 8px #39ff88,
                0 0 15px #a855f7;
        }


        /* =========================
           МАЛЕНЬКАЯ МЫШКА
        ========================= */

        .bat {
            position: relative;

            width: 82px;
            height: 55px;

            flex-shrink: 0;

            margin-left: 4px;

            margin-bottom: -2px;

            transform:
                translateY(2px);

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(168, 85, 247, 0.7)
                );

            animation:
                littleBat 3s ease-in-out infinite;
        }


        @keyframes littleBat {

            0%,
            100% {
                transform:
                    translateY(2px)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-5px)
                    rotate(2deg);
            }
        }


        /* =========================
           КРЫЛЬЯ
        ========================= */

        .wing {
            position: absolute;

            top: 14px;

            width: 44px;
            height: 34px;

            background:
                linear-gradient(
                    145deg,
                    #241332,
                    #55257b,
                    #241536
                );

            border: 1px solid #9d5bd0;

            clip-path:
                polygon(
                    100% 45%,
                    72% 8%,
                    58% 32%,
                    38% 0,
                    42% 43%,
                    8% 18%,
                    23% 63%,
                    0 52%,
                    25% 86%,
                    55% 100%,
                    100% 74%
                );
        }


        .wing-left {
            left: 0;

            transform-origin: right center;

            animation:
                flapLeft 1.8s ease-in-out infinite;
        }


        .wing-right {
            right: 0;

            transform:
                scaleX(-1);

            transform-origin: left center;

            animation:
                flapRight 1.8s ease-in-out infinite;
        }


        @keyframes flapLeft {

            0%,
            100% {
                transform: rotate(0);
            }

            50% {
                transform: rotate(8deg);
            }
        }


        @keyframes flapRight {

            0%,
            100% {
                transform:
                    scaleX(-1)
                    rotate(0);
            }

            50% {
                transform:
                    scaleX(-1)
                    rotate(8deg);
            }
        }


        /* =========================
           ТЕЛО МЫШКИ
        ========================= */

        .bat-body {
            position: absolute;

            width: 32px;
            height: 38px;

            left: 25px;
            top: 17px;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #4b3654,
                    #171222 75%
                );

            border-radius:
                48% 48% 43% 43%;

            z-index: 3;
        }


        /* =========================
           ГОЛОВА
        ========================= */

        .bat-head {
            position: absolute;

            width: 42px;
            height: 36px;

            left: 20px;
            top: 8px;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #4b3654,
                    #171222 75%
                );

            border-radius:
                48% 48% 45% 45%;

            z-index: 5;
        }


        /* =========================
           УШИ
        ========================= */

        .ear {
            position: absolute;

            width: 16px;
            height: 22px;

            top: -11px;

            background:
                linear-gradient(
                    135deg,
                    #251632,
                    #713b75
                );

            border: 1px solid #a855f7;

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    50% 78%,
                    0 100%
                );
        }


        .ear-left {
            left: 3px;

            transform: rotate(-15deg);
        }


        .ear-right {
            right: 3px;

            transform: rotate(15deg);
        }


        /* =========================
           ГЛАЗА
        ========================= */

        .eye {
            position: absolute;

            width: 11px;
            height: 14px;

            top: 13px;

            border-radius: 50%;

            border: 1px solid #16101d;

            z-index: 8;

            /* Голубо-карий цвет */

            background:
                radial-gradient(
                    circle at 45% 45%,
                    #d7f5ff 0%,
                    #78c8e8 35%,
                    #6c8b9b 52%,
                    #76542d 75%,
                    #39220e 100%
                );

            box-shadow:
                0 0 6px
                rgba(130, 210, 255, 0.8);
        }


        .eye-left {
            left: 6px;
        }


        .eye-right {
            right: 6px;
        }


        /* Зрачок */

        .eye::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 9px;

            background: #20130d;

            border-radius: 50%;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);
        }


        /* Блик */

        .eye::before {
            content: "";

            position: absolute;

            width: 3px;
            height: 3px;

            background: white;

            border-radius: 50%;

            left: 2px;
            top: 2px;
        }


        /* Нос */

        .nose {
            position: absolute;

            width: 6px;
            height: 4px;

            background: #120b18;

            border-radius: 50%;

            left: 50%;
            top: 25px;

            transform:
                translateX(-50%);
        }


        /* =========================
           ДЕКОРАТИВНАЯ ЛИНИЯ
        ========================= */

        .decoration {

            width: 280px;

            height: 2px;

            margin-top: 35px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #a855f7,
                    #f4d77b,
                    #a855f7,
                    transparent
                );

            box-shadow:
                0 0 10px
                rgba(244, 215, 123, 0.5);

            position: relative;
        }


        .decoration::before,
        .decoration::after {

            content: "✦";

            position: absolute;

            top: -13px;

            color: #c084fc;

            font-size: 18px;
        }


        .decoration::before {
            left: -5px;
        }


        .decoration::after {
            right: -5px;
        }


        /* =========================
           ОПИСАНИЕ
        ========================= */

        .description {

            max-width: 720px;

            margin:
                38px
                auto
                0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    26px,
                    4vw,
                    42px
                );

            line-height: 1.25;

            font-style: italic;

            color: #edc968;

            text-shadow:

                0 0 7px
                rgba(244, 215, 123, 0.45),

                0 0 18px
                rgba(168, 85, 247, 0.18);
        }


        /* =========================
           КНОПКА
        ========================= */

        .explore-button {

            margin-top: 45px;

            padding:
                17px
                50px;

            min-width: 330px;

            border:
                2px solid
                #d9aa35;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #35146d,
                    #6328b5,
                    #25174d
                );

            color: #f5d477;

            font-family:
                "Allura",
                cursive;

            font-size: 32px;

            font-style: italic;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            box-shadow:

                0 0 15px
                rgba(168, 85, 247, 0.45),

                inset 0 0 15px
                rgba(168, 85, 247, 0.15);

            text-shadow:
                0 0 7px
                rgba(245, 212, 119, 0.5);
        }


        .explore-button:hover {

            transform:
                translateY(-5px)
                scale(1.04);

            border-color:
                #ffe49a;

            box-shadow:

                0 0 25px
                rgba(168, 85, 247, 0.8),

                0 0 45px
                rgba(57, 255, 136, 0.25);
        }


        .explore-button:active {

            transform:
                translateY(-1px)
                scale(0.98);
        }


        /* =========================
           ТЕЛЕФОН
        ========================= */

        @media (max-width: 600px) {

            .hero {
                padding:
                    40px
                    15px
                    50px;
            }


            h1 {
                font-size: 52px;
            }


            .world-name {
                gap: 5px;
            }


            .bat {
                width: 62px;
                height: 45px;
            }


            .wing {
                width: 34px;
                height: 28px;
            }


            .bat-body {
                width: 26px;
                height: 31px;

                left: 18px;
                top: 14px;
            }


            .bat-head {
                width: 34px;
                height: 30px;

                left: 14px;
                top: 7px;
            }


            .eye {
                width: 9px;
                height: 11px;

                top: 11px;
            }


            .eye-left {
                left: 5px;
            }


            .eye-right {
                right: 5px;
            }


            .description {
                font-size: 31px;
            }


            .explore-button {
                min-width: 0;

                width: 90%;

                font-size: 29px;
            }

        }

    </style>
</head>


<body>

    <!-- Светящиеся пятна -->

    <div class="glow-green"></div>
    <div class="glow-purple"></div>


    <!-- Магические огоньки -->

    <div class="star star1"></div>
    <div class="star star2"></div>
    <div class="star star3"></div>
    <div class="star star4"></div>


    <main class="hero">


        <!-- =====================
             ПРИВЕТСТВИЕ
        ====================== -->

        <h1>

            <span class="welcome">
                Добро Пожаловать
            </span>


            <span>
                в мир
            </span>


            <span class="world-name">

                TrixiObserves!

                <!-- Маленькая мышка -->

                <span class="bat">

                    <span class="wing wing-left"></span>

                    <span class="wing wing-right"></span>

                    <span class="bat-body"></span>

                    <span class="bat-head">

                        <span class="ear ear-left"></span>

                        <span class="ear ear-right"></span>

                        <span class="eye eye-left"></span>

                        <span class="eye eye-right"></span>

                        <span class="nose"></span>

                    </span>

                </span>

            </span>

        </h1>


        <!-- Декоративная линия -->

        <div class="decoration"></div>


        <!-- =====================
             ОПИСАНИЕ
        ====================== -->

        <p class="description">

            Исследуй забытые мифы.<br>

            Найди в них ответы и путь к себе.

        </p>


        <!-- =====================
             КНОПКА
        ====================== -->

        <button
            class="explore-button"
            onclick="startExploring()"
        >

            Начать путешествие ✦

        </button>


    </main>


    <script>

        function startExploring() {

            window.location.href = "explore.html";

        }

    </script>

</body>
</html>
