<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrixiObserves — Мир забытых мифов</title>

    <!-- Красивый рукописный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 40%,
                    rgba(25, 120, 100, 0.18),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 65%,
                    rgba(110, 45, 170, 0.24),
                    transparent 40%
                ),
                #050816;

            color: #f5d477;
            overflow-x: hidden;
        }


        /* ========================================
           СВЕЧЕНИЯ ФОНА
        ======================================== */

        .glow-green {
            position: fixed;

            width: 400px;
            height: 400px;

            background: #39ff88;

            opacity: 0.08;

            filter: blur(120px);

            border-radius: 50%;

            top: 10%;
            left: -100px;

            pointer-events: none;
        }


        .glow-purple {
            position: fixed;

            width: 450px;
            height: 450px;

            background: #a855f7;

            opacity: 0.14;

            filter: blur(130px);

            border-radius: 50%;

            bottom: -100px;
            right: -80px;

            pointer-events: none;
        }


        /* ========================================
           МАЛЕНЬКИЕ ОГОНЬКИ
        ======================================== */

        .dot {
            position: fixed;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            z-index: 2;

            animation: floating 4s ease-in-out infinite;
        }


        .dot1 {
            top: 25%;
            right: 10%;

            background: #39ff88;

            box-shadow:
                0 0 10px #39ff88,
                0 0 25px #39ff88;
        }


        .dot2 {
            bottom: 20%;
            left: 9%;

            background: #a855f7;

            box-shadow:
                0 0 10px #a855f7,
                0 0 25px #a855f7;

            animation-delay: 1s;
        }


        .dot3 {
            top: 48%;
            left: 7%;

            background: #39ff88;

            box-shadow:
                0 0 10px #39ff88,
                0 0 25px #39ff88;

            animation-delay: 2s;
        }


        .dot4 {
            bottom: 30%;
            right: 13%;

            background: #f4c95d;

            box-shadow:
                0 0 10px #f4c95d,
                0 0 22px #f4c95d;

            animation-delay: 1.5s;
        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* ========================================
           ГЛАВНЫЙ ЭКРАН
        ======================================== */

        .hero {
            position: relative;

            z-index: 3;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 50px 25px 80px;
        }


        /* ========================================
           ДОБРО ПОЖАЛОВАТЬ
        ======================================== */

        h1 {
            max-width: 1150px;

            margin: 0;

            font-family: "Allura", cursive;

            font-size: clamp(60px, 8vw, 105px);

            line-height: 1.02;

            font-weight: 400;

            font-style: italic;

            color: #f2c85c;

            transform: rotate(-1.5deg);

            text-shadow:
                0 0 5px rgba(255, 230, 140, 0.7),
                0 0 15px rgba(244, 190, 65, 0.55),
                0 0 32px rgba(168, 85, 247, 0.20);
        }


        .welcome-line {
            display: block;
        }


        /* ========================================
           TRIXIOBSERVES
        ======================================== */

        .trixi-line {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            position: relative;

            margin-top: 5px;
        }


        .world-name {
            position: relative;

            display: inline-block;

            padding: 0 6px 5px;

            background:
                linear-gradient(
                    90deg,
                    #42f59b,
                    #75e7ba,
                    #9bbbdc,
                    #b785ed,
                    #a855f7
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            text-shadow: none;
        }


        /* Светящаяся линия */

        .world-name::after {
            content: "";

            position: absolute;

            left: 2%;
            right: 2%;

            bottom: 0;

            height: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    90deg,
                    #39ff88,
                    #8ce6bd,
                    #a855f7
                );

            box-shadow:
                0 0 7px rgba(57, 255, 136, 0.8),
                0 0 12px rgba(168, 85, 247, 0.7);
        }


        /* ========================================
           МИЛАЯ ЛЕТУЧАЯ МЫШКА
        ======================================== */

        .bat {
            position: relative;

            display: inline-block;

            width: 88px;
            height: 67px;

            margin-left: 13px;

            flex-shrink: 0;

            transform: translateY(7px);

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(168, 85, 247, 0.65)
                );

            animation: bat-floating 3s ease-in-out infinite;
        }


        @keyframes bat-floating {

            0%,
            100% {
                transform:
                    translateY(7px)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(1px)
                    rotate(2deg);
            }
        }


        /* ----------------------------------------
           ЛЕВОЕ КРЫЛО
        ---------------------------------------- */

        .wing-left {
            position: absolute;

            width: 43px;
            height: 42px;

            left: 0;
            top: 18px;

            background:
                linear-gradient(
                    135deg,
                    #0b090b 5%,
                    #2b1c1b 55%,
                    #4a2925 100%
                );

            clip-path:
                polygon(
                    100% 32%,
                    76% 15%,
                    63% 30%,
                    42% 7%,
                    40% 39%,
                    7% 24%,
                    22% 58%,
                    5% 70%,
                    40% 78%,
                    65% 100%,
                    100% 72%
                );

            transform-origin: right center;

            animation: left-wing 1.8s ease-in-out infinite;

            z-index: 1;
        }


        /* ----------------------------------------
           ПРАВОЕ КРЫЛО
        ---------------------------------------- */

        .wing-right {
            position: absolute;

            width: 43px;
            height: 42px;

            right: 0;
            top: 18px;

            background:
                linear-gradient(
                    225deg,
                    #0b090b 5%,
                    #2b1c1b 55%,
                    #4a2925 100%
                );

            clip-path:
                polygon(
                    0 32%,
                    24% 15%,
                    37% 30%,
                    58% 7%,
                    60% 39%,
                    93% 24%,
                    78% 58%,
                    95% 70%,
                    60% 78%,
                    35% 100%,
                    0 72%
                );

            transform-origin: left center;

            animation: right-wing 1.8s ease-in-out infinite;

            z-index: 1;
        }


        @keyframes left-wing {

            0%,
            100% {
                transform: rotate(2deg);
            }

            50% {
                transform: rotate(10deg);
            }
        }


        @keyframes right-wing {

            0%,
            100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(-10deg);
            }
        }


        /* ========================================
           ТЕЛЬЦЕ
        ======================================== */

        .bat-body {
            position: absolute;

            width: 29px;
            height: 36px;

            left: 30px;
            top: 28px;

            border-radius:
                48% 48% 55% 55%;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #463330,
                    #211718 55%,
                    #09080b 100%
                );

            z-index: 3;
        }


        /* Маленький животик */

        .bat-belly {
            position: absolute;

            width: 17px;
            height: 19px;

            left: 6px;
            bottom: 3px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(109, 76, 61, 0.6),
                    rgba(34, 23, 24, 0.2)
                );
        }


        /* ========================================
           ГОЛОВА
        ======================================== */

        .bat-head {
            position: absolute;

            width: 40px;
            height: 36px;

            left: 24px;
            top: 9px;

            border-radius:
                50% 50% 48% 48%;

            background:
                radial-gradient(
                    circle at 50% 32%,
                    #4a3634 0%,
                    #281b1c 48%,
                    #0d0b0e 100%
                );

            z-index: 5;

            box-shadow:
                inset 0 -4px 8px rgba(0, 0, 0, 0.4);
        }


        /* ========================================
           УШКИ
        ======================================== */

        .ear {
            position: absolute;

            width: 18px;
            height: 27px;

            top: -15px;

            background:
                linear-gradient(
                    150deg,
                    #3b2826,
                    #171013
                );

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    0 82%
                );

            z-index: -1;
        }


        .ear-left {
            left: 0;

            transform:
                rotate(-15deg);
        }


        .ear-right {
            right: 0;

            transform:
                scaleX(-1)
                rotate(-15deg);
        }


        /* Внутренняя часть ушек */

        .ear::after {
            content: "";

            position: absolute;

            width: 9px;
            height: 18px;

            top: 6px;
            left: 5px;

            background:
                linear-gradient(
                    #70423f,
                    #352124
                );

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    0 82%
                );
        }


        /* ========================================
           ГЛАЗА
        ======================================== */

        .eye {
            position: absolute;

            width: 12px;
            height: 16px;

            top: 10px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 36% 25%,

                    #ffffff 0 7%,

                    #bdefff 8% 17%,

                    #6ec8ec 18% 36%,

                    #8e7658 37% 58%,

                    #68482f 59% 75%,

                    #17100d 76% 100%
                );

            border:
                1px solid
                rgba(190, 230, 240, 0.5);

            box-shadow:
                0 0 6px rgba(90, 205, 255, 0.8),
                0 0 10px rgba(127, 95, 65, 0.3);

            z-index: 8;
        }


        .eye-left {
            left: 7px;
        }


        .eye-right {
            right: 7px;
        }


        /* Зрачок */

        .eye::after {
            content: "";

            position: absolute;

            width: 3px;
            height: 9px;

            left: 4px;
            top: 4px;

            border-radius: 50%;

            background: #08080b;
        }


        /* ========================================
           НОСИК
        ======================================== */

        .nose {
            position: absolute;

            width: 6px;
            height: 5px;

            left: 17px;
            top: 25px;

            border-radius:
                50% 50% 60% 60%;

            background: #9a6655;

            z-index: 9;

            box-shadow:
                0 0 3px rgba(255, 190, 170, 0.35);
        }


        /* ========================================
           МИЛАЯ УЛЫБКА
        ======================================== */

        .mouth {
            position: absolute;

            width: 10px;
            height: 5px;

            left: 15px;
            top: 29px;

            border-bottom:
                1px solid
                #8c6058;

            border-radius: 50%;

            z-index: 9;
        }


        /* ========================================
           ДЕКОРАТИВНЫЙ РАЗДЕЛИТЕЛЬ
        ======================================== */

        .divider {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 13px;

            width: 420px;

            max-width: 80%;

            margin-top: 40px;
        }


        .divider-line {
            height: 2px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #a855f7,
                    #f4d77b
                );

            box-shadow:
                0 0 8px rgba(168, 85, 247, 0.6);
        }


        .divider-line.right {
            background:
                linear-gradient(
                    90deg,
                    #f4d77b,
                    #a855f7,
                    transparent
                );
        }


        .divider-star {
            color: #f4d77b;

            font-size: 21px;

            text-shadow:
                0 0 10px #f4d77b;
        }


        /* ========================================
           ТЕКСТ ПОД ЗАГОЛОВКОМ
        ======================================== */

        .description {
            max-width: 850px;

            margin:
                35px
                auto
                0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    32px,
                    4.5vw,
                    50px
                );

            line-height: 1.3;

            font-style: italic;

            color: #edc968;

            transform: rotate(-1.5deg);

            text-shadow:
                0 0 7px rgba(244, 215, 123, 0.5),
                0 0 18px rgba(168, 85, 247, 0.18);
        }


        /* ========================================
           КНОПКА
        ======================================== */

        .explore-button {
            margin-top: 60px;

            padding:
                17px
                50px;

            min-width: 350px;

            border:
                2px solid
                #d9aa35;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #35146d,
                    #5824a6,
                    #291650
                );

            color: #f5d477;

            font-family:
                "Allura",
                cursive;

            font-size: 35px;

            font-style: italic;

            text-decoration: none;

            display: inline-block;

            cursor: pointer;

            transform: rotate(-1deg);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            box-shadow:
                0 0 15px rgba(168, 85, 247, 0.45),
                inset 0 0 15px rgba(168, 85, 247, 0.15);

            text-shadow:
                0 0 8px rgba(245, 212, 119, 0.6);
        }


        .explore-button:hover {
            transform:
                rotate(-1deg)
                translateY(-5px)
                scale(1.04);

            border-color: #f5d477;

            box-shadow:
                0 0 20px rgba(168, 85, 247, 0.7),
                0 0 45px rgba(57, 255, 136, 0.2);
        }


        /* ========================================
           МОБИЛЬНАЯ ВЕРСИЯ
        ======================================== */

        @media (max-width: 700px) {

            .hero {
                padding:
                    45px
                    15px
                    75px;
            }


            h1 {
                font-size: 54px;
            }


            .trixi-line {
                flex-wrap: nowrap;
            }


            .bat {
                width: 67px;
                height: 55px;

                margin-left: 5px;

                transform: scale(0.8);
            }


            .description {
                font-size: 33px;

                padding:
                    0 10px;
            }


            .divider {
                margin-top: 32px;

                width: 300px;
            }


            .explore-button {
                min-width: 0;

                width: 88%;

                padding:
                    15px
                    20px;

                margin-top: 52px;

                font-size: 31px;
            }
        }

    </style>
</head>


<body>

    <!-- Фоновые свечения -->

    <div class="glow-green"></div>
    <div class="glow-purple"></div>


    <!-- Магические огоньки -->

    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>
    <div class="dot dot4"></div>


    <main class="hero">


        <!-- =====================================
             ГЛАВНЫЙ ЗАГОЛОВОК
        ====================================== -->

        <h1>

            <span class="welcome-line">
                Добро Пожаловать
            </span>


            <span class="trixi-line">

                <span>
                    в мир&nbsp;
                </span>


                <span class="world-name">
                    TrixiObserves!
                </span>


                <!-- =================================
                     МИЛАЯ ЛЕТУЧАЯ МЫШКА
                ================================== -->

                <span class="bat">

                    <!-- крылья -->

                    <span class="wing-left"></span>

                    <span class="wing-right"></span>


                    <!-- тело -->

                    <span class="bat-body">

                        <span class="bat-belly"></span>

                    </span>


                    <!-- голова -->

                    <span class="bat-head">

                        <!-- ушки -->

                        <span class="ear ear-left"></span>

                        <span class="ear ear-right"></span>


                        <!-- голубо-карие глаза -->

                        <span class="eye eye-left"></span>

                        <span class="eye eye-right"></span>


                        <!-- носик -->

                        <span class="nose"></span>


                        <!-- улыбка -->

                        <span class="mouth"></span>

                    </span>

                </span>

            </span>

        </h1>


        <!-- =====================================
             ДЕКОРАТИВНАЯ ЛИНИЯ
        ====================================== -->

        <div class="divider">

            <div class="divider-line"></div>

            <span class="divider-star">
                ✦
            </span>

            <div class="divider-line right"></div>

        </div>


        <!-- =====================================
             ОПИСАНИЕ
        ====================================== -->

        <p class="description">

            Исследуй забытые мифы.<br>

            Найди в них ответы и путь к себе.

        </p>


        <!-- =====================================
             КНОПКА
        ====================================== -->

        <a
            href="explore.html"
            class="explore-button"
        >
            Начать путешествие ✦
        </a>


    </main>

</body>
</html>
