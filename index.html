<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TrixiObserves — Мир забытых мифов</title>


    <!-- Каллиграфические шрифты -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           ОСНОВНЫЕ НАСТРОЙКИ
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(20, 70, 70, 0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 85%,
                    rgba(91, 35, 150, 0.20),
                    transparent 40%
                ),
                #050816;

            color: #f5d477;

            overflow-x: hidden;
        }


        /* =========================
           СВЕЧЕНИЯ НА ФОНЕ
        ========================= */

        .glow-green {

            position: fixed;

            width: 350px;
            height: 350px;

            background: #39ff88;

            opacity: 0.10;

            filter: blur(110px);

            border-radius: 50%;

            top: 8%;
            left: 0;

            pointer-events: none;
        }


        .glow-purple {

            position: fixed;

            width: 420px;
            height: 420px;

            background: #a855f7;

            opacity: 0.13;

            filter: blur(120px);

            border-radius: 50%;

            bottom: 0;
            right: -50px;

            pointer-events: none;
        }


        /* =========================
           ДЕКОРАТИВНЫЕ ТОЧКИ
        ========================= */

        .dot {

            position: fixed;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #39ff88;

            box-shadow:
                0 0 10px #39ff88,
                0 0 25px #39ff88;

            z-index: 2;

            animation:
                floating 4s ease-in-out infinite;
        }


        .dot1 {

            top: 25%;
            right: 12%;
        }


        .dot2 {

            bottom: 22%;
            left: 12%;

            background: #a855f7;

            box-shadow:
                0 0 10px #a855f7,
                0 0 25px #a855f7;

            animation-delay: 1s;
        }


        .dot3 {

            top: 42%;
            left: 7%;

            animation-delay: 2s;
        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        .hero {

            position: relative;

            z-index: 3;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            padding:
                70px
                25px
                90px;
        }


        /* =========================
           ВЕРХНИЙ ЛОГОТИП
        ========================= */

        .logo-area {

            position: relative;

            display: inline-flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 35px;

            cursor: default;
        }


        .logo {

            position: relative;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    48px,
                    9vw,
                    86px
                );

            font-weight: 400;

            font-style: italic;

            letter-spacing: 2px;

            color: #f4d77b;

            text-shadow:

                0 0 4px
                rgba(255, 255, 255, 0.35),

                0 0 12px
                rgba(244, 215, 123, 0.45),

                0 0 28px
                rgba(168, 85, 247, 0.25);

            transform: rotate(-2deg);

            white-space: nowrap;
        }


        /* Декоративная линия */

        .logo-decoration {

            width: 250px;

            height: 2px;

            margin-top: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #a855f7,
                    #f4d77b,
                    #a855f7,
                    transparent
                );

            box-shadow:
                0 0 10px
                rgba(244, 215, 123, 0.5);
        }


        .logo-decoration::before,
        .logo-decoration::after {

            content: "✦";

            position: absolute;

            color: #c084fc;

            font-size: 14px;
        }


        .logo-decoration::before {

            transform:
                translateX(-145px)
                translateY(-9px);
        }


        .logo-decoration::after {

            transform:
                translateX(130px)
                translateY(-9px);
        }


        /* =========================
           ЛЕТУЧАЯ МЫШЬ
        ========================= */

        .bat {

            position: absolute;

            width: 62px;
            height: 42px;

            right: -75px;
            top: -18px;

            transition:
                transform 0.4s ease,
                filter 0.4s ease;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(168, 85, 247, 0.7)
                );
        }


        .bat:hover {

            transform:
                scale(1.15)
                rotate(-5deg);

            filter:
                drop-shadow(
                    0 0 15px
                    #a855f7
                );
        }


        .bat-body {

            position: absolute;

            width: 13px;
            height: 20px;

            background: #191326;

            border-radius:
                50% 50% 45% 45%;

            left: 25px;
            top: 10px;
        }


        .bat-head {

            position: absolute;

            width: 18px;
            height: 18px;

            background: #191326;

            border-radius: 50%;

            left: 22px;
            top: 5px;
        }


        .bat-head::before,
        .bat-head::after {

            content: "";

            position: absolute;

            width: 8px;
            height: 11px;

            background: #191326;

            top: -6px;
        }


        .bat-head::before {

            left: 0;

            clip-path:
                polygon(
                    0 100%,
                    40% 0,
                    100% 100%
                );
        }


        .bat-head::after {

            right: 0;

            clip-path:
                polygon(
                    0 100%,
                    60% 0,
                    100% 100%
                );
        }


        .wing-left {

            position: absolute;

            width: 34px;
            height: 30px;

            left: -2px;
            top: 7px;

            background:
                linear-gradient(
                    135deg,
                    #191326,
                    #31184c
                );

            clip-path:
                polygon(
                    100% 40%,
                    65% 10%,
                    55% 30%,
                    30% 5%,
                    35% 45%,
                    0 30%,
                    20% 75%,
                    50% 100%,
                    100% 70%
                );

            transform-origin: right center;

            animation:
                wingLeft 1.8s ease-in-out infinite;
        }


        .wing-right {

            position: absolute;

            width: 34px;
            height: 30px;

            right: -2px;
            top: 7px;

            background:
                linear-gradient(
                    225deg,
                    #191326,
                    #31184c
                );

            clip-path:
                polygon(
                    0 40%,
                    35% 10%,
                    45% 30%,
                    70% 5%,
                    65% 45%,
                    100% 30%,
                    80% 75%,
                    50% 100%,
                    0 70%
                );

            transform-origin: left center;

            animation:
                wingRight 1.8s ease-in-out infinite;
        }


        @keyframes wingLeft {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(10deg);
            }
        }


        @keyframes wingRight {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(-10deg);
            }
        }


        /* =========================
           ГЛАВНЫЙ ЗАГОЛОВОК
        ========================= */

        h1 {

            max-width: 900px;

            margin: 15px 0 0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    55px,
                    9vw,
                    100px
                );

            line-height: 0.95;

            font-weight: 400;

            font-style: italic;

            color: #f1c85c;

            text-shadow:

                0 0 5px
                rgba(255, 230, 140, 0.6),

                0 0 15px
                rgba(244, 190, 65, 0.55),

                0 0 35px
                rgba(168, 85, 247, 0.25);

            transform: rotate(-1deg);
        }


        .world {

            display: block;

            font-size:
                clamp(
                    70px,
                    11vw,
                    120px
                );

            margin-bottom: 5px;
        }


        .world-name {

            display: inline-block;

            color: #f5cf65;

            text-shadow:

                0 0 5px #ffe9a6,

                0 0 15px #eab94e,

                0 0 30px
                rgba(124, 58, 237, 0.5);

            position: relative;
        }


        /* =========================
           ОПИСАНИЕ
        ========================= */

        .description {

            max-width: 700px;

            margin:
                65px
                auto
                0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    28px,
                    5vw,
                    48px
                );

            line-height: 1.25;

            font-style: italic;

            color: #edc968;

            text-shadow:

                0 0 7px
                rgba(244, 215, 123, 0.45),

                0 0 18px
                rgba(168, 85, 247, 0.18);
        }


        /* =========================
           КНОПКА
        ========================= */

        .explore-button {

            /* Кнопка немного ниже */

            margin-top: 70px;

            padding:
                18px
                50px;

            min-width: 330px;

            border:
                2px solid
                #d9aa35;

            border-radius: 50px;

            background:

                linear-gradient(
                    135deg,
                    #35146d,
                    #5220a0,
                    #25174d
                );

            color: #f5d477;

            font-family:
                "Allura",
                cursive;

            font-size: 32px;

            font-style: italic;

            text-decoration: none;

            display: inline-block;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            box-shadow:

                0 0 15px
                rgba(168, 85, 247, 0.45),

                inset 0 0 15px
                rgba(168, 85, 247, 0.15);
        }


        .explore-button:hover {

            transform:
                translateY(-5px)
                scale(1.03);

            border-color:
                #f5d477;

            color: #ffe59a;

            box-shadow:

                0 0 20px
                rgba(168, 85, 247, 0.7),

                0 0 45px
                rgba(57, 255, 136, 0.2);
        }


        .explore-button:active {

            transform:
                translateY(-1px)
                scale(0.98);
        }


        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 600px) {

            .hero {

                padding:
                    55px
                    18px
                    70px;
            }


            .logo {

                font-size: 54px;
            }


            .logo-decoration {

                width: 190px;
            }


            .logo-decoration::before {

                transform:
                    translateX(-110px)
                    translateY(-9px);
            }


            .logo-decoration::after {

                transform:
                    translateX(95px)
                    translateY(-9px);
            }


            .bat {

                width: 48px;

                height: 34px;

                right: -55px;

                top: -10px;
            }


            h1 {

                font-size: 64px;

                line-height: 0.95;
            }


            .world {

                font-size: 78px;
            }


            .description {

                margin-top: 55px;

                font-size: 34px;

                padding: 0 10px;
            }


            .explore-button {

                min-width: 0;

                width: 90%;

                padding:
                    17px
                    20px;

                font-size: 30px;

                margin-top: 55px;
            }


            .dot1 {
                right: 10%;
            }


            .dot2 {
                left: 8%;
            }

        }

    </style>

</head>


<body>


    <!-- Светящиеся пятна -->

    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <!-- Магические огоньки -->

    <div class="dot dot1"></div>

    <div class="dot dot2"></div>

    <div class="dot dot3"></div>


    <main class="hero">


        <!-- =====================
             ВЕРХНИЙ ЛОГОТИП
        ====================== -->

        <div class="logo-area">

            <div class="logo">

                TrixiObserves


                <!-- Летучая мышь -->

                <div class="bat">

                    <div class="wing-left"></div>

                    <div class="wing-right"></div>

                    <div class="bat-body"></div>

                    <div class="bat-head"></div>

                </div>

            </div>


            <div class="logo-decoration"></div>

        </div>


        <!-- =====================
             ГЛАВНЫЙ ТЕКСТ
        ====================== -->

        <h1>

            <span class="world">
                Мир
            </span>

            <span class="world-name">
                TrixiObserves!
            </span>

        </h1>


        <!-- =====================
             ОПИСАНИЕ
        ====================== -->

        <p class="description">

            Исследуй забытые мифы.<br>

            Найди в них ответы и<br>

            путь к себе.

        </p>


        <!-- =====================
             КНОПКА
        ====================== -->

        <a
            href="explore.html"
            class="explore-button"
        >

            Начать путешествие ✦

        </a>


    </main>

</body>

</html>
