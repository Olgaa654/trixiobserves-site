<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrixiObserves</title>

    <!-- Рукописный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            /* Рукописный шрифт */
            font-family: "Marck Script", cursive;

            background: #050816;
            color: #d8a93a;
            overflow: hidden;
        }

        /* Светящееся зелёное свечение */
        .glow-green {
            position: absolute;
            width: 350px;
            height: 350px;

            background: #39ff88;
            opacity: 0.12;

            filter: blur(100px);
            border-radius: 50%;

            top: 10%;
            left: 5%;
        }

        /* Светящееся сиреневое свечение */
        .glow-purple {
            position: absolute;
            width: 400px;
            height: 400px;

            background: #a855f7;
            opacity: 0.15;

            filter: blur(110px);
            border-radius: 50%;

            bottom: 5%;
            right: 5%;
        }

        /* Главный экран */
        .hero {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;
        }

        /* Название */
        .small-title {
            color: #e6b84a;

            font-size: 28px;
            letter-spacing: 3px;

            margin-bottom: 25px;

            font-style: italic;

            transform: rotate(-2deg);

            text-shadow:
                0 0 8px rgba(230, 184, 74, 0.6),
                0 0 20px rgba(230, 184, 74, 0.25);
        }

        /* Главный заголовок */
        h1 {
            font-family: "Marck Script", cursive;

            font-size: clamp(50px, 8vw, 92px);

            line-height: 1.05;

            margin: 0;

            font-weight: 400;
            font-style: italic;

            color: #e6b84a;

            transform: rotate(-2deg);

            text-shadow:
                0 2px 0 #9a6d19,
                0 0 8px rgba(230, 184, 74, 0.7),
                0 0 25px rgba(230, 184, 74, 0.25);
        }

        /* Текст под заголовком */
        .description {
            max-width: 750px;

            margin-top: 35px;

            font-family: "Marck Script", cursive;

            font-size: clamp(25px, 3vw, 34px);

            line-height: 1.45;

            color: #dcb45b;

            font-style: italic;

            transform: rotate(-1.5deg);

            text-shadow:
                0 0 8px rgba(220, 180, 91, 0.5),
                0 0 18px rgba(220, 180, 91, 0.2);
        }

        /* Кнопка */
        .explore-button {
            margin-top: 40px;

            padding: 15px 34px;

            border: 1px solid #d8a93a;
            border-radius: 40px;

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.8),
                    rgba(88, 28, 135, 0.85)
                );

            color: #f0c85b;

            font-family: "Marck Script", cursive;

            font-size: 25px;
            font-weight: 400;

            font-style: italic;

            cursor: pointer;

            transition: 0.3s;

            transform: rotate(-1deg);

            box-shadow:
                0 0 15px rgba(216, 169, 58, 0.35),
                0 0 25px rgba(168, 85, 247, 0.3);

            text-shadow:
                0 0 7px rgba(240, 200, 91, 0.5);
        }

        /* Эффект при наведении */
        .explore-button:hover {
            transform:
                rotate(-1deg)
                translateY(-4px)
                scale(1.04);

            border-color: #f5d477;

            color: #ffe59a;

            box-shadow:
                0 0 20px rgba(216, 169, 58, 0.65),
                0 0 40px rgba(57, 255, 136, 0.25);
        }

        /* Декоративные точки */
        .dot {
            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #39ff88;

            box-shadow:
                0 0 15px #39ff88;
        }

        .dot1 {
            top: 20%;
            right: 15%;
        }

        .dot2 {
            bottom: 20%;
            left: 15%;

            background: #a855f7;

            box-shadow:
                0 0 15px #a855f7;
        }

        .dot3 {
            top: 35%;
            left: 10%;
        }

        /* Чтобы на телефоне всё выглядело аккуратно */
        @media (max-width: 600px) {

            .hero {
                padding: 20px;
            }

            .small-title {
                font-size: 23px;
            }

            h1 {
                font-size: 48px;
            }

            .description {
                font-size: 25px;
                max-width: 90%;
            }

            .explore-button {
                font-size: 23px;
                padding: 13px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="glow-green"></div>
    <div class="glow-purple"></div>

    <div class="dot dot1"></div>
    <div class="dot dot2"></div>
    <div class="dot dot3"></div>

    <main class="hero">

        <div class="small-title">
            TrixiObserves
        </div>

        <h1>
            Добро пожаловать<br>
            в мир TrixiObserves!
        </h1>

        <p class="description">
            Исследуй забытые мифы.
            Найди в них ответы и путь к себе.
        </p>

        <a href="explore.html" class="explore-button">
           Начать путешествие ✦
        </a>

    </main>

</body>
</html>
