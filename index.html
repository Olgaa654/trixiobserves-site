<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrixiObserves — Мир забытых мифов</title>

    <!-- Рукописные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 45%,
                    rgba(25, 120, 100, 0.20),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 65%,
                    rgba(110, 45, 170, 0.25),
                    transparent 38%
                ),
                #050816;

            color: #f5d477;

            overflow-x: hidden;
        }


        /* =========================
           СВЕЧЕНИЯ
        ========================= */

        .glow-green {
            position: fixed;

            width: 400px;
            height: 400px;

            background: #39ff88;

            opacity: 0.09;

            filter: blur(120px);

            border-radius: 50%;

            top: 15%;
            left: -100px;

            pointer-events: none;
        }


        .glow-purple {
            position: fixed;

            width: 450px;
            height: 450px;

            background: #a855f7;

            opacity: 0.14;

            filter: blur(130px);

            border-radius: 50%;

            bottom: -100px;
            right: -80px;

            pointer-events: none;
        }


        /* =========================
           МАГИЧЕСКИЕ ТОЧКИ
        ========================= */

        .dot {
            position: fixed;

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #39ff88;

            box-shadow:
                0 0 10px #39ff88,
                0 0 25px #39ff88;

            z-index: 2;

            animation: floating 4s ease-in-out infinite;
        }


        .dot1 {
            top: 27%;
            right: 10%;
        }


        .dot2 {
            bottom: 20%;
            left: 9%;

            background: #a855f7;

            box-shadow:
                0 0 10px #a855f7,
                0 0 25px #a855f7;

            animation-delay: 1s;
        }


        .dot3 {
            top: 45%;
            left: 7%;

            animation-delay: 2s;
        }


        .dot4 {
            bottom: 28%;
            right: 15%;

            background: #f4c95d;

            box-shadow:
                0 0 10px #f4c95d,
                0 0 22px #f4c95d;

            animation-delay: 1.5s;
        }


        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }


        /* =========================
           ГЛАВНЫЙ ЭКРАН
        ========================= */

        .hero {
            position: relative;

            z-index: 3;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            padding:
                65px
                25px
                100px;
        }


        /* =========================
           НАЗВАНИЕ TRIXIOBSERVES
        ========================= */

        .logo-area {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 28px;
        }


        .logo-line {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }


        .logo {

            font-family: "Allura", cursive;

            font-size: clamp(
                34px,
                5vw,
                55px
            );

            font-weight: 400;

            font-style: italic;

            letter-spacing: 2px;

            background:
                linear-gradient(
                    90deg,
                    #39ff88,
                    #8de3c2,
                    #b78aff,
                    #a855f7
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            transform: rotate(-3deg);

            text-shadow:
                0 0 10px rgba(57, 255, 136, 0.18),
                0 0 20px rgba(168, 85, 247, 0.20);

            white-space: nowrap;
        }


        /* =========================
           ЛЕТУЧАЯ МЫШКА
        ========================= */

        .bat {

            position: relative;

            width: 62px;
            height: 48px;

            margin-left: 3px;

            transform:
                translateY(4px)
                rotate(-3deg);

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(168, 85, 247, 0.65)
                );

            animation: batFloat 3s ease-in-out infinite;
        }


        @keyframes batFloat {

            0%,
            100% {
                transform:
                    translateY(4px)
                    rotate(-3deg);
            }

            50% {
                transform:
                    translateY(-3px)
                    rotate(2deg);
            }
        }


        /* Тело */

        .bat-body {

            position: absolute;

            width: 20px;
            height: 27px;

            left: 21px;
            top: 15px;

            background:
                linear-gradient(
                    180deg,
                    #241b22,
                    #0c0b10
                );

            border-radius:
                48% 48% 45% 45%;

            z-index: 4;
        }


        /* Голова */

        .bat-head {

            position: absolute;

            width: 28px;
            height: 25px;

            left: 17px;
            top: 4px;

            background:
                radial-gradient(
                    circle at 45% 35%,
                    #40333a,
                    #161319 70%
                );

            border-radius:
                48% 48% 45% 45%;

            z-index: 5;
        }


        /* Ушки */

        .bat-ear-left,
        .bat-ear-right {

            position: absolute;

            width: 15px;
            height: 20px;

            top: -10px;

            background:
                linear-gradient(
                    135deg,
                    #24191d,
                    #0d0b10
                );

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    0 100%
                );

            z-index: 3;
        }


        .bat-ear-left {
            left: 0;
            transform: rotate(-12deg);
        }


        .bat-ear-right {
            right: 0;
            transform: rotate(12deg);
        }


        /* Внутренняя часть ушек */

        .bat-ear-left::after,
        .bat-ear-right::after {

            content: "";

            position: absolute;

            width: 7px;
            height: 12px;

            top: 5px;
            left: 4px;

            background: #56333b;

            clip-path:
                polygon(
                    50% 0,
                    100% 100%,
                    0 100%
                );
        }


        /* Глаза */

        .eye {

            position: absolute;

            width: 8px;
            height: 11px;

            top: 10px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 40% 30%,
                    #ffffff 0 8%,
                    #7ed8ff 12%,
                    #6a91b8 40%,
                    #8a6b45 68%,
                    #34251d 100%
                );

            box-shadow:
                0 0 6px rgba(90, 200, 255, 0.9);

            z-index: 7;
        }


        .eye-left {
            left: 21px;
        }


        .eye-right {
            right: 21px;
        }


        /* Зрачки */

        .eye::after {

            content: "";

            position: absolute;

            width: 2px;
            height: 7px;

            background: #071019;

            border-radius: 50%;

            left: 3px;
            top: 2px;
        }


        /* Носик */

        .bat-head::after {

            content: "";

            position: absolute;

            width: 5px;
            height: 4px;

            background: #8b6650;

            border-radius: 50%;

            left: 11px;
            bottom: 3px;

            z-index: 8;
        }


        /* Левое крыло */

        .wing-left {

            position: absolute;

            width: 37px;
            height: 34px;

            left: -8px;
            top: 13px;

            background:
                linear-gradient(
                    135deg,
                    #09090b,
                    #241a1a 55%,
                    #3a2425
                );

            clip-path:
                polygon(
                    100% 38%,
                    72% 12%,
                    58% 32%,
                    38% 4%,
                    35% 43%,
                    0 24%,
                    15% 65%,
                    38% 78%,
                    55% 100%,
                    100% 70%
                );

            transform-origin: right center;

            animation:
                wingLeft 1.5s ease-in-out infinite;
        }


        /* Правое крыло */

        .wing-right {

            position: absolute;

            width: 37px;
            height: 34px;

            right: -8px;
            top: 13px;

            background:
                linear-gradient(
                    225deg,
                    #09090b,
                    #241a1a 55%,
                    #3a2425
                );

            clip-path:
                polygon(
                    0 38%,
                    28% 12%,
                    42% 32%,
                    62% 4%,
                    65% 43%,
                    100% 24%,
                    85% 65%,
                    62% 78%,
                    45% 100%,
                    0 70%
                );

            transform-origin: left center;

            animation:
                wingRight 1.5s ease-in-out infinite;
        }


        @keyframes wingLeft {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(9deg);
            }
        }


        @keyframes wingRight {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(-9deg);
            }
        }


        /* =========================
           ЛИНИЯ ПОД НАЗВАНИЕМ
        ========================= */

        .logo-decoration {

            width: 330px;

            height: 3px;

            margin-top: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #39ff88,
                    #9be6c2,
                    #a855f7,
                    transparent
                );

            box-shadow:
                0 0 10px rgba(57, 255, 136, 0.5),
                0 0 15px rgba(168, 85, 247, 0.5);

            transform:
                rotate(-1deg);
        }


        /* =========================
           ГЛАВНЫЙ ТЕКСТ
        ========================= */

        h1 {

            max-width: 1100px;

            margin: 10px 0 0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    50px,
                    8vw,
                    92px
                );

            line-height: 0.95;

            font-weight: 400;

            font-style: italic;

            color: #f4cf68;

            text-shadow:
                0 0 5px rgba(255, 230, 140, 0.7),
                0 0 15px rgba(244, 190, 65, 0.55),
                0 0 30px rgba(168, 85, 247, 0.25);

            transform:
                rotate(-2deg);
        }


        .welcome {
            display: block;
        }


        .world-name {

            display: inline-block;

            margin-left: 8px;

            background:
                linear-gradient(
                    90deg,
                    #39ff88,
                    #78e4ba,
                    #a8a1e8,
                    #a855f7
                );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            position: relative;

            text-shadow: none;

            transform:
                rotate(-2deg);
        }


        /* Подчёркивание TrixiObserves */

        .world-name::after {

            content: "";

            position: absolute;

            height: 3px;

            left: 2%;

            right: 2%;

            bottom: -5px;

            background:
                linear-gradient(
                    90deg,
                    #39ff88,
                    #9be6c2,
                    #a855f7
                );

            box-shadow:
                0 0 8px #39ff88,
                0 0 14px #a855f7;

            transform:
                rotate(-1deg);
        }


        /* =========================
           ДЕКОРАТИВНЫЙ РАЗДЕЛИТЕЛЬ
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;

            width: 430px;

            max-width: 80%;

            margin-top: 42px;
        }


        .divider-line {

            height: 2px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #a855f7,
                    #f4d77b
                );

            box-shadow:
                0 0 8px rgba(168, 85, 247, 0.6);
        }


        .divider-line.right {

            background:
                linear-gradient(
                    90deg,
                    #f4d77b,
                    #a855f7,
                    transparent
                );
        }


        .divider-star {

            color: #f4d77b;

            font-size: 22px;

            text-shadow:
                0 0 10px #f4d77b;
        }


        /* =========================
           ОПИСАНИЕ
        ========================= */

        .description {

            max-width: 850px;

            margin:
                35px
                auto
                0;

            font-family:
                "Allura",
                cursive;

            font-size:
                clamp(
                    30px,
                    4.5vw,
                    48px
                );

            line-height: 1.35;

            font-style: italic;

            color: #edc968;

            transform:
                rotate(-2deg);

            text-shadow:
                0 0 7px rgba(244, 215, 123, 0.5),
                0 0 18px rgba(168, 85, 247, 0.18);
        }


        /* =========================
           КНОПКА
        ========================= */

        .explore-button {

            margin-top: 62px;

            padding:
                17px
                48px;

            min-width: 340px;

            border:
                2px solid
                #d9aa35;

            border-radius: 50px;

            background:
                linear-gradient(
                    135deg,
                    #35146d,
                    #5220a0,
                    #25174d
                );

            color: #f5d477;

            font-family:
                "Allura",
                cursive;

            font-size: 34px;

            font-style: italic;

            text-decoration: none;

            display: inline-block;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;

            transform:
                rotate(-1deg);

            box-shadow:
                0 0 15px rgba(168, 85, 247, 0.45),
                inset 0 0 15px rgba(168, 85, 247, 0.15);

            text-shadow:
                0 0 8px rgba(245, 212, 119, 0.6);
        }


        .explore-button:hover {

            transform:
                rotate(-1deg)
                translateY(-5px)
                scale(1.04);

            border-color:
                #f5d477;

            box-shadow:
                0 0 20px rgba(168, 85, 247, 0.7),
                0 0 45px rgba(57, 255, 136, 0.2);
        }


        .explore-button:active {

            transform:
                rotate(-1deg)
                translateY(-1px)
                scale(0.98);
        }


        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 600px) {

            .hero {

                padding:
                    45px
                    15px
                    80px;
            }


            .logo {

                font-size: 39px;
            }


            .bat {

                width: 52px;
                height: 42px;

                transform:
                    translateY(3px)
                    scale(0.85);
            }


            h1 {

                font-size: 52px;

                line-height: 0.98;
            }


            .world-name {

                margin-left: 0;
            }


            .description {

                margin-top: 30px;

                font-size: 32px;

                padding:
                    0 10px;
            }


            .divider {

                width: 300px;

                margin-top: 35px;
            }


            .explore-button {

                min-width: 0;

                width: 88%;

                padding:
                    16px
                    20px;

                font-size: 31px;

                margin-top: 55px;
            }


            .dot1 {
                right: 7%;
            }


            .dot2 {
                left: 6%;
            }
        }

    </style>
</head>


<body>

    <!-- Светящиеся пятна -->

    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <!-- Магические огоньки -->

    <div class="dot dot1"></div>

    <div class="dot dot2"></div>

    <div class="dot dot3"></div>

    <div class="dot dot4"></div>


    <main class="hero">


        <!-- Название -->

        <div class="logo-area">

            <div class="logo-line">

                <div class="logo">
                    TrixiObserves
                </div>


                <!-- Маленькая летучая мышка -->

                <div class="bat">

                    <div class="wing-left"></div>

                    <div class="wing-right"></div>

                    <div class="bat-body"></div>

                    <div class="bat-head">

                        <div class="bat-ear-left"></div>

                        <div class="bat-ear-right"></div>

                        <div class="eye eye-left"></div>

                        <div class="eye eye-right"></div>

                    </div>

                </div>

            </div>


            <div class="logo-decoration"></div>

        </div>


        <!-- Главный текст -->

        <h1>

            <span class="welcome">
                Добро Пожаловать
            </span>

            <span>
                в мир
            </span>

            <span class="world-name">
                TrixiObserves!
            </span>

        </h1>


        <!-- Разделитель -->

        <div class="divider">

            <div class="divider-line"></div>

            <span class="divider-star">✦</span>

            <div class="divider-line right"></div>

        </div>


        <!-- Описание -->

        <p class="description">

            Исследуй забытые мифы.<br>

            Найди в них ответы и путь к себе.

        </p>


        <!-- Кнопка -->

        <a
            href="explore.html"
            class="explore-button"
        >
            Начать путешествие ✦
        </a>


    </main>

</body>
</html>
