<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrixiObserves — Мир</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="explore-page">


    <!-- =========================
         ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ
    ========================== -->

    <div class="language-switcher">

        <!-- 🇷🇺 Русский -->

        <button
            class="language-button"
            data-language="ru"
            onclick="changeLanguage('ru')"
            title="Русский"
            aria-label="Русский"
        >

            <svg
                viewBox="0 0 30 20"
                class="flag-image"
            >

                <rect
                    width="30"
                    height="6.67"
                    fill="#ffffff"
                />

                <rect
                    y="6.67"
                    width="30"
                    height="6.67"
                    fill="#1f4fa3"
                />

                <rect
                    y="13.34"
                    width="30"
                    height="6.66"
                    fill="#d52b1e"
                />

            </svg>

        </button>


        <!-- 🇩🇪 Deutsch -->

        <button
            class="language-button"
            data-language="de"
            onclick="changeLanguage('de')"
            title="Deutsch"
            aria-label="Deutsch"
        >

            <svg
                viewBox="0 0 30 20"
                class="flag-image"
            >

                <rect
                    width="30"
                    height="6.67"
                    fill="#111111"
                />

                <rect
                    y="6.67"
                    width="30"
                    height="6.67"
                    fill="#d71920"
                />

                <rect
                    y="13.34"
                    width="30"
                    height="6.66"
                    fill="#f4c542"
                />

            </svg>

        </button>


        <!-- 🇬🇧 English -->

        <button
            class="language-button"
            data-language="en"
            onclick="changeLanguage('en')"
            title="English"
            aria-label="English"
        >

            <svg
                viewBox="0 0 60 40"
                class="flag-image"
            >

                <rect
                    width="60"
                    height="40"
                    fill="#173b8f"
                />

                <path
                    d="M0 0 L7 0 L60 33 L60 40 L53 40 L0 7 Z"
                    fill="white"
                />

                <path
                    d="M60 0 L53 0 L0 33 L0 40 L7 40 L60 7 Z"
                    fill="white"
                />

                <path
                    d="M0 0 L3 0 L60 35 L60 40 L57 40 L0 5 Z"
                    fill="#c8102e"
                />

                <path
                    d="M60 0 L57 0 L0 35 L0 40 L3 40 L60 5 Z"
                    fill="#c8102e"
                />

                <rect
                    x="25"
                    width="10"
                    height="40"
                    fill="white"
                />

                <rect
                    y="15"
                    width="60"
                    height="10"
                    fill="white"
                />

                <rect
                    x="27"
                    width="6"
                    height="40"
                    fill="#c8102e"
                />

                <rect
                    y="17"
                    width="60"
                    height="6"
                    fill="#c8102e"
                />

            </svg>

        </button>

    </div>


    <!-- =========================
         СВЕЧЕНИЯ
    ========================== -->

    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <!-- =========================
         ДЕКОРАТИВНЫЕ ТОЧКИ
    ========================== -->

    <div class="magic-dot dot-one"></div>

    <div class="magic-dot dot-two"></div>

    <div class="magic-dot dot-three"></div>


    <!-- =========================
         ОСНОВНАЯ СТРАНИЦА
    ========================== -->

    <main class="explore-container">


        <!-- =========================
             ЗАГОЛОВОК
        ========================== -->

        <h1 class="page-title">

            <span data-i18n="world">
                Мир
            </span>

            <span class="world-name">
                TrixiObserves
            </span>

        </h1>


        <!-- =========================
             ВСТУПЛЕНИЕ
        ========================== -->

        <p
            class="explore-intro"
            data-i18n="exploreIntro"
        >
            Здесь начинаются путешествия,
            открываются забытые истории
            и оживают старые мифы.
        </p>


        <!-- =========================
             НАВИГАЦИЯ
        ========================== -->

        <nav class="world-navigation">


            <a
                href="explore.html"
                class="world-button"
                data-i18n="aboutWorld"
            >
                О мире TrixiObserves
            </a>


            <a
                href="diary.html"
                class="world-button"
                data-i18n="diary"
            >
                Путевой Дневник Трикси
            </a>


            <a
                href="gallery.html"
                class="world-button"
                data-i18n="gallery"
            >
                Галерея
            </a>


            <a
                href="sketches.html"
                class="world-button"
                data-i18n="sketches"
            >
                Зарисовки из путешествий
            </a>


            <a
                href="https://cara.app/trixiobserves"
                target="_blank"
                rel="noopener noreferrer"
                class="world-button cara-button"
                data-i18n="cara"
            >
                🎨 Галерея на Cara ↗
            </a>

        </nav>


        <!-- =========================
             РАЗДЕЛИТЕЛЬ
        ========================== -->

        <div class="explore-divider"></div>


        <!-- =========================
             ЦИТАТА
        ========================== -->

        <p
            class="world-quote"
            data-i18n="quote"
        >
            «У каждой истории есть след.
            Нужно лишь знать, где искать.»
        </p>


        <!-- =========================
             НАЗАД
        ========================== -->

        <a
            href="index.html"
            class="back-home"
            data-i18n="backHome"
        >
            ← Назад к началу пути
        </a>


    </main>


    <script src="script.js"></script>

</body>

</html>
