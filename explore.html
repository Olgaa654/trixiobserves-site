<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrixiObserves — Мир</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="explore-page">


    <!-- =========================
         ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ
    ========================== -->

    <div class="language-switcher">

        <button
            class="language-button"
            data-language="ru"
            onclick="changeLanguage('ru')"
        >
            🇷🇺
        </button>

        <button
            class="language-button"
            data-language="de"
            onclick="changeLanguage('de')"
        >
            🇩🇪
        </button>

        <button
            class="language-button"
            data-language="en"
            onclick="changeLanguage('en')"
        >
            🇬🇧
        </button>

    </div>


    <!-- =========================
         СВЕЧЕНИЯ
    ========================== -->

    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <!-- =========================
         ОСНОВНАЯ СТРАНИЦА
    ========================== -->

    <main class="explore-container">


        <!-- Заголовок -->

        <h1 class="page-title">

            <span data-i18n="world">
                Мир
            </span>

            <span class="world-name">
                TrixiObserves
            </span>

        </h1>


        <!-- Вступление -->

        <p
            class="explore-intro"
            data-i18n="exploreIntro"
        >
            Здесь начинаются путешествия,
            открываются забытые истории
            и оживают старые мифы.
        </p>


        <!-- =========================
             НАВИГАЦИЯ
        ========================== -->

        <nav class="world-navigation">


            <a
                href="explore.html"
                class="world-button"
                data-i18n="aboutWorld"
            >
                О мире TrixiObserves
            </a>


            <a
                href="diary.html"
                class="world-button"
                data-i18n="diary"
            >
                Путевой Дневник Трикси
            </a>


            <a
                href="gallery.html"
                class="world-button"
                data-i18n="gallery"
            >
                Галерея
            </a>


            <a
                href="sketches.html"
                class="world-button"
                data-i18n="sketches"
            >
                Зарисовки из путешествий
            </a>


            <a
                href="https://cara.app/trixiobserves"
                target="_blank"
                rel="noopener noreferrer"
                class="world-button cara-button"
                data-i18n="cara"
            >
                🎨 Галерея на Cara ↗
            </a>

        </nav>


        <!-- =========================
             РАЗДЕЛИТЕЛЬ
        ========================== -->

        <div class="explore-divider"></div>


        <!-- =========================
             ЦИТАТА
        ========================== -->

        <p
            class="world-quote"
            data-i18n="quote"
        >
            «У каждой истории есть след.
            Нужно лишь знать, где искать.»
        </p>


        <!-- =========================
             ВОЗВРАЩЕНИЕ НА ГЛАВНУЮ
        ========================== -->

        <a
            href="index.html"
            class="back-home"
            data-i18n="backHome"
        >
            ← Назад к началу пути
        </a>


    </main>


    <script src="script.js?v=2"></script>

</body>

</html>
