<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Мир TrixiObserves</title>

    <!-- Рукописный шрифт -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: "Marck Script", cursive;

            background: #050816;

            color: #e6b84a;

            overflow-x: hidden;
        }


        /* Зелёное свечение */

        .glow-green {

            position: fixed;

            width: 400px;
            height: 400px;

            background: #39ff88;

            opacity: 0.10;

            filter: blur(120px);

            border-radius: 50%;

            top: 5%;
            left: 5%;

            pointer-events: none;
        }


        /* Сиреневое свечение */

        .glow-purple {

            position: fixed;

            width: 450px;
            height: 450px;

            background: #a855f7;

            opacity: 0.13;

            filter: blur(130px);

            border-radius: 50%;

            bottom: 0;
            right: 0;

            pointer-events: none;
        }


        /* Основной контейнер */

        .page {

            position: relative;

            z-index: 1;

            min-height: 100vh;

            padding: 70px 30px;

            text-align: center;
        }


        /* Заголовок */

        .title {

            font-size: clamp(50px, 8vw, 90px);

            font-weight: 400;

            font-style: italic;

            margin: 0;

            transform: rotate(-2deg);

            color: #e6b84a;

            text-shadow:

                0 2px 0 #8d6419,

                0 0 10px rgba(230,184,74,0.7),

                0 0 30px rgba(230,184,74,0.2);
        }


        .subtitle {

            max-width: 700px;

            margin: 25px auto 55px;

            font-size: 29px;

            line-height: 1.5;

            font-style: italic;

            color: #dcb45b;

            transform: rotate(-1deg);

            text-shadow:

                0 0 8px rgba(220,180,91,0.5);
        }


        /* Меню */

        .menu {

            display: flex;

            justify-content: center;

            align-items: stretch;

            gap: 18px;

            max-width: 1200px;

            margin: 0 auto;

            flex-wrap: wrap;
        }


        /* Кнопки */

        .menu-button {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 75px;

            padding: 15px 25px;

            border: 1px solid rgba(230,184,74,0.7);

            border-radius: 18px;

            background:

                linear-gradient(

                    135deg,

                    rgba(124,58,237,0.18),

                    rgba(5,8,22,0.75)

                );

            color: #e6b84a;

            text-decoration: none;

            font-family: "Marck Script", cursive;

            font-size: 24px;

            font-style: italic;

            transition: 0.3s;

            box-shadow:

                0 0 15px rgba(230,184,74,0.12);
        }


        /* Наведение */

        .menu-button:hover {

            transform:

                translateY(-5px)

                rotate(-1deg);

            color: #ffe69a;

            border-color: #f5d477;

            background:

                linear-gradient(

                    135deg,

                    rgba(168,85,247,0.35),

                    rgba(57,255,136,0.08)

                );

            box-shadow:

                0 0 20px rgba(230,184,74,0.35),

                0 0 35px rgba(168,85,247,0.2);
        }


        /* Разделитель */

        .divider {

            width: 180px;

            height: 1px;

            margin: 60px auto 35px;

            background:

                linear-gradient(

                    90deg,

                    transparent,

                    #e6b84a,

                    transparent

                );

            opacity: 0.6;
        }


        .quote {

            max-width: 650px;

            margin: auto;

            font-size: 26px;

            line-height: 1.6;

            font-style: italic;

            color: #bfa66a;

        }


        /* Точки */

        .dot {

            position: fixed;

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #39ff88;

            box-shadow: 0 0 15px #39ff88;

        }


        .dot1 {

            top: 18%;

            right: 10%;
        }


        .dot2 {

            bottom: 15%;

            left: 12%;

            background: #a855f7;

            box-shadow: 0 0 15px #a855f7;
        }


        /* Телефон */

        @media (max-width: 700px) {

            .page {

                padding: 50px 20px;
            }

            .title {

                font-size: 55px;
            }

            .subtitle {

                font-size: 25px;
            }

            .menu {

                flex-direction: column;

                max-width: 500px;
            }

            .menu-button {

                width: 100%;

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="glow-green"></div>

    <div class="glow-purple"></div>


    <div class="dot dot1"></div>

    <div class="dot dot2"></div>


    <main class="page">


        <h1 class="title">

            Мир TrixiObserves

        </h1>


        <p class="subtitle">

            Здесь начинаются путешествия,
            открываются забытые истории
            и оживают старые мифы.

        </p>


        <nav class="menu">


            <a href="about.html"
               class="menu-button">

                О мире TrixiObserves

            </a>


            <a href="diary.html"
               class="menu-button">

                Путевой Дневник Трикси

            </a>


            <a href="gallery.html"
               class="menu-button">

                Галерея

            </a>


            <a href="sketches.html"
               class="menu-button">

                Зарисовки из путешествий

            </a>


            <a href="https://cara.app/trixiobserves"
               class="menu-button"
               target="_blank"
               rel="noopener noreferrer">

                🎨 Галерея на Cara ↗

            </a>


        </nav>


        <div class="divider"></div>


        <p class="quote">

            «У каждой истории есть след.
            Нужно лишь знать, где искать.»

        </p>


    </main>


</body>

</html>
